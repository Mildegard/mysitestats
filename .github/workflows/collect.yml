name: Collect LiveInternet Stats

on:
  schedule:
    - cron: '0 21 * * *'   # каждый день в 21:00 UTC
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run collector
        run: node collect.js

         - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Подтягиваем свежие изменения с GitHub
          git pull --rebase origin main || true
          
          git add data.json
          if git diff --staged --quiet; then
            echo "Нет изменений в data.json — пропускаем коммит"
          else
            git commit -m "Update stats $(date -u +%Y-%m-%d)"
            git push
          fi
