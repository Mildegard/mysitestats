name: Collect LiveInternet Stats

on:
  schedule:
    - cron: '0 21 * * *'   # каждый день в 21:00 UTC (можно поменять)
  workflow_dispatch:        # можно запускать вручную

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run collector
        run: node collect.js

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stats $(date +%Y-%m-%d)" && git push)
